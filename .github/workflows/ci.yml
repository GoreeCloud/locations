name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web-and-api:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: locations
          POSTGRES_DB: locations_test
          POSTGRES_PASSWORD: synthetic-only-postgis-test-pass-2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U locations -d locations_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://locations:synthetic-only-postgis-test-pass-2026@127.0.0.1:5432/locations_test
      - name: Verify mandatory repository records
        run: |
          for file in docs/ROADMAP.md docs/FEATURES.md docs/OBJECTIVES.md; do
            test -s "$file" || { echo "Missing required document: $file" >&2; exit 1; }
          done
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: locations-web-development-preview
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and run disposable web, API and PostGIS with Docker
        env:
          CONTAINER_ENGINE: docker
        run: bash scripts/smoke-containers.sh
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Enforce no covert Android location collection
        run: |
          ! grep -R -q 'android.permission.ACCESS_BACKGROUND_LOCATION' apps/android/app/src/main
          ! grep -R -q 'android.permission.RECEIVE_BOOT_COMPLETED' apps/android/app/src/main
      - run: chmod +x apps/android/gradlew
      - run: cd apps/android && ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: locations-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
