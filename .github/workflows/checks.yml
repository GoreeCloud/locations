name: Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  private-grid:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Ruby syntax and offline tests
        run: |
          ruby --version
          ruby -c bin/gc-private-grid
          ruby -c lib/goreecloud_locations/private_grid.rb
          ruby test/goreecloud/private_grid_test.rb
